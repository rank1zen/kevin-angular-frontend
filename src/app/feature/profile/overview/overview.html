@defer (when matchHistory() !== null) {
  <div class="flex flex-col items-center">
    @for (match of matchHistory(); track match.kills) {
      <app-match-history-card [data]="match"></app-match-history-card>
    }
  </div>
} @loading (minimum 1000ms) {
  <app-match-history-card-skeleton></app-match-history-card-skeleton>
} @placeholder (minimum 1000ms) {
}
