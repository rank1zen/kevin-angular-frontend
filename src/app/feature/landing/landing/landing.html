<div class="flex flex-col items-center px-6">
  <h1 class="font-bold text-6xl tracking-tight mb-12">
    A lightweight League of Legends client
  </h1>

  <app-search-bar class="mb-12"></app-search-bar>

  @defer (on immediate) {
    <app-ladder [ladderModel]="landingService.getLadder()"></app-ladder>
  }
  @loading (minimum 200ms) {
    <div>Loading...</div>
  }
  @placeholder {
    <div>Placeholder...</div>
  }
</div>
